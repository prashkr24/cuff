name: Something isn't working
description: Vibrations missing, errors, Health Connect or Google Health sync problems, or crashes.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. The Air's interface is undocumented and version sensitive, so your phone and firmware details help most.

        **Device → About → Copy these details** puts the app version, your Android version and the band's firmware on the clipboard in one go. Paste that into the fields below.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you expected, what happened instead, and roughly when.
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: Air firmware
      description: Device → About → Firmware. Say "not read" if the band would not answer.
      placeholder: 67.20001.253.2
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Air Bridge version
      description: Device → About → Air Bridge.
      placeholder: "0.3.0"
    validations:
      required: true
  - type: input
    id: phone
    attributes:
      label: Phone and Android version
      placeholder: Pixel 7 Pro, Android 16
    validations:
      required: true
  - type: dropdown
    id: half
    attributes:
      label: Which half is affected?
      options:
        - The relay (calls and notifications reaching the band)
        - The Health tab (readings from Health Connect)
        - Widgets
        - Both, or not sure
    validations:
      required: true
  - type: dropdown
    id: sync
    attributes:
      label: Does Google Health still sync with the band?
      description: The band grants one secure session at a time, so this is often the clue.
      options: ["Yes", "No, it stalls", "Not sure"]
  - type: checkboxes
    id: checked
    attributes:
      label: Already checked
      description: Device → Permissions shows all of these in one place.
      options:
        - label: Notification access is granted
        - label: Nearby devices (Bluetooth) is granted
        - label: The app is allowed to run in the background
        - label: Only one build of this app is installed — two fight over the band
  - type: textarea
    id: log
    attributes:
      label: Error log (optional)
      description: |
        Device → About carries an error-log section, which appears only when something has gone wrong. Its **Send** button hands the log to Android's share sheet. It holds stack traces, your app version, your Android version and the band's firmware — no message text and no contact names. Read it before posting.
      render: text
