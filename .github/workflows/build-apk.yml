name: Build APK

# Builds a release APK in the cloud on every push to native
# (or manually from the Actions tab → Build APK → Run workflow).
# Download it afterwards from the run page → Artifacts → cuff-apk.

on:
  push:
    branches: [native]
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Configure release signing, if secrets are set
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.CUFF_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK
        env:
          CUFF_KEYSTORE: ${{ steps.signing.outputs.signed == 'true' && format('{0}/release.jks', runner.temp) || '' }}
          CUFF_KEYSTORE_PASSWORD: ${{ secrets.CUFF_KEYSTORE_PASSWORD }}
          CUFF_KEY_ALIAS: ${{ secrets.CUFF_KEY_ALIAS }}
          CUFF_KEY_PASSWORD: ${{ secrets.CUFF_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cuff-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
